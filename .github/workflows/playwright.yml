name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label to use (for example: ubuntu-latest)'
        required: true
        type: string
        default: ubuntu-latest
      labels:
        description: 'Playwright tags to run, comma-separated (for example: @smoke,@regression)'
        required: false
        type: string
        default: '@smoke,@regression'

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    env:
      AUTOMATION_EXRC_URL: ${{ vars.AUTOMATION_EXRC_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run Playwright tests for selected labels
        env:
          PLAYWRIGHT_LABELS: ${{ inputs.labels }}
        run: |
          if [ -z "$PLAYWRIGHT_LABELS" ]; then
            npx playwright test
          else
            grep_pattern="${PLAYWRIGHT_LABELS//,/|}"
            npx playwright test --grep "$grep_pattern"
          fi