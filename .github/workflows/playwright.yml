name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label to use"
        required: true
        type: string
        default: ubuntu-latest
      labels:
        description: "Playwright tags to run, comma-separated (optional)"
        required: false
        type: string
        default: ""

jobs:
  test:
    name: Playwright Test Run
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30

    env:
      # Map GitHub Actions variable to environment variable in the runner
      AUTOMATION_EXRC_URL: ${{ vars.AUTOMATION_EXRC_URL }}
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_LABELS: ${{ inputs.labels }}
        run: |
          if [ -z "${PLAYWRIGHT_LABELS}" ]; then
            npx playwright test
          else
            grep_pattern="${PLAYWRIGHT_LABELS//,/|}"
            npx playwright test --grep "$grep_pattern"
          fi
